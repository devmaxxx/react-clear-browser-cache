name: Release

# Publishes to npm through Trusted Publishing: npm trusts this workflow file
# via OIDC, so no token or one-time password is stored, and the package gets a
# provenance statement.
on:
  release:
    types: [published]
  # For a version whose GitHub release already exists.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency: release

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm test:unit

      - name: Check the version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_EVENT_NAME" = release ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $version"
            exit 1
          fi
          if npm view "react-clear-browser-cache@$version" version >/dev/null 2>&1; then
            echo "::error::react-clear-browser-cache@$version is already on npm"
            exit 1
          fi
          # Prereleases must not become `latest`.
          case "$version" in
            *-*) echo "tag=next" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag=latest" >> "$GITHUB_OUTPUT" ;;
          esac

      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@^11.5.1
      - run: npm publish --tag ${{ steps.version.outputs.tag }}
